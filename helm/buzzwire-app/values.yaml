image:
  repository: ghcr.io/vishvesh11/zapped/buzzwire-app
  tag: "c22e6b0d3b2924bc6275272a156d4a8812c3367f"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

storage:
  size: 1Gi
  storageClassName: "" # Uses default k3s local-path provisioner

service:
  type: ClusterIP
  port: 80

env:
  phoneSnapshotUrl: "http://100.64.0.8:8080/shot.jpg"
  s3Endpoint: "https://s3.vishvesh.me"
  s3Region: "garage"
  s3Bucket: "buzzwire-zaps"
  existingSecret: "buzzwire-secrets"

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  host: diwaligame.vishvesh.me
  path: /
  pathType: Prefix
  tls:
    - hosts:
        - diwaligame.vishvesh.me
      secretName: diwali-buzzwire-tls

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
httpRoute:
  enabled: false
