image:
  repository: ghcr.io/vishvesh11/diwali-buzzwire/buzzwire-app
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

storage:
  size: 1Gi
  storageClassName: "" # Uses default k3s local-path provisioner

service:
  type: ClusterIP
  port: 80
env:
  phoneSnapshotUrl: "http://100.64.0.15:8080/shot.jpg"
  s3Endpoint: "https://s3.vishvesh.me"
  s3Region: "garage"
  s3Bucket: "buzzwire-zaps"
  existingSecret: "buzzwire-secrets"

ingress:
  enabled: true
  className: "traefik"
  host: "diwaligame.vishvesh.me"
  annotations:
    external-dns.alpha.kubernetes.io/target: ""
