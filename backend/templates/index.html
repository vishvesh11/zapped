<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzz Wire Challenge — Leaderboard & Zap Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-3xl">⚡</span>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-amber-400">BUZZ WIRE CHALLENGE</h1>
          <p class="text-xs text-slate-400">Live Standings & Zapped Action Gallery</p>
        </div>
      </div>

      <!-- Live Active Run Banner -->
      <div id="live-banner" class="hidden items-center gap-4 bg-amber-500/10 border border-amber-500/40 px-4 py-2 rounded-lg">
        <span class="h-2.5 w-2.5 rounded-full bg-amber-400 animate-ping"></span>
        <div class="text-sm">
          <span class="text-slate-400">Now Playing:</span>
          <strong id="live-player" class="text-white ml-1">-</strong>
          <span id="live-phase" class="ml-2 text-xs uppercase px-2 py-0.5 rounded bg-slate-800 text-amber-300">WAITING</span>
        </div>
        <div class="text-sm font-mono border-l border-slate-700 pl-4">
          Touches: <strong id="live-touches" class="text-rose-400">0</strong>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Grid -->
  <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

    <!-- Left Column: Leaderboard (7 cols) -->
    <section class="lg:col-span-7">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-white">🏆 Top Standings</h2>
        <span class="text-xs text-slate-400">Click a player to view their Zap Photos</span>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-800 text-xs uppercase text-slate-400 bg-slate-900/80">
              <th class="py-3.5 px-4">Rank</th>
              <th class="py-3.5 px-4">Player</th>
              <th class="py-3.5 px-4 text-center">Touches</th>
              <th class="py-3.5 px-4 text-right">Time</th>
              <th class="py-3.5 px-4 text-right">Score</th>
              <th class="py-3.5 px-4 text-center">Photos</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body" class="divide-y divide-slate-800/70 text-sm">
            <tr><td colspan="6" class="py-8 text-center text-slate-500">Loading leaderboard...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Right Column: Live Zap Wall (5 cols) -->
    <section class="lg:col-span-5">
      <div class="flex items-center justify-between mb-4">
        <h2 id="gallery-title" class="text-lg font-semibold text-amber-400">📸 Latest Zapped Moments</h2>
        <button id="reset-gallery-btn" onclick="loadPhotos()" class="hidden text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded">
          Show All Photos
        </button>
      </div>

      <div id="photo-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <p class="text-slate-500 text-sm col-span-2 py-8 text-center">No zaps captured yet!</p>
      </div>
    </section>

  </main>

  <!-- Lightbox Modal for Fullscreen Image & Download -->
  <div id="lightbox" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4" onclick="closeLightbox()">
    <div class="max-w-3xl w-full bg-slate-900 border border-amber-500/40 rounded-xl p-4" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" class="w-full rounded-lg mb-4" alt="Zap Shot" />
      <div class="flex justify-between items-center">
        <a id="lightbox-dl" href="" download class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm">
          ⬇ Download Photo
        </a>
        <button onclick="closeLightbox()" class="text-slate-400 hover:text-white text-sm px-3 py-2">Close</button>
      </div>
    </div>
  </div>

  <script>
    async function loadLeaderboard() {
      const res = await fetch('/public/leaderboard');
      const data = await res.json();
      const tbody = document.getElementById('leaderboard-body');
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-500">No runs completed yet. Be the first!</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(row => `
        <tr class="hover:bg-slate-800/60 transition cursor-pointer" onclick="filterBySession('${row.session_id || ''}', '${row.player_name.replace(/'/g, "\\'")}')">
          <td class="py-3.5 px-4 font-bold ${row.rank <= 3 ? 'text-amber-400' : 'text-slate-400'}">#${row.rank}</td>
          <td class="py-3.5 px-4 font-medium text-white">${row.player_name}</td>
          <td class="py-3.5 px-4 text-center">
            <span class="px-2 py-0.5 rounded text-xs font-semibold ${row.touch_count === 0 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}">
              ${row.touch_count}
            </span>
          </td>
          <td class="py-3.5 px-4 text-right font-mono text-slate-300">${row.completion_time_seconds.toFixed(2)}s</td>
          <td class="py-3.5 px-4 text-right font-bold text-amber-300 font-mono">${row.score}</td>
          <td class="py-3.5 px-4 text-center">
            <span class="text-xs text-amber-400 hover:underline">View 📸</span>
          </td>
        </tr>
      `).join('');
    }

    async function loadPhotos(sessionId = null, playerName = null) {
      const url = sessionId ? `/public/photos?session_id=${sessionId}` : '/public/photos';
      const res = await fetch(url);
      const photos = await res.json();
      const grid = document.getElementById('photo-grid');
      const title = document.getElementById('gallery-title');
      const resetBtn = document.getElementById('reset-gallery-btn');

      if (sessionId) {
        title.innerText = `📸 ${playerName}'s Zap Photos`;
        resetBtn.classList.remove('hidden');
      } else {
        title.innerText = '📸 Latest Zapped Moments';
        resetBtn.classList.add('hidden');
      }

      if (!photos.length) {
        grid.innerHTML = `<p class="text-slate-500 text-sm col-span-2 py-8 text-center">No zap photos found ${playerName ? 'for ' + playerName : 'yet'} — steady hands!</p>`;
        return;
      }

      grid.innerHTML = photos.map(p => `
        <div class="bg-slate-900 border border-slate-800 hover:border-amber-400/60 rounded-xl overflow-hidden shadow transition cursor-pointer group"
             onclick="openLightbox('${p.url}')">
          <div class="aspect-video bg-slate-950 overflow-hidden">
            <img src="${p.url}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
          </div>
        </div>
      `).join('');
    }

    function filterBySession(sessionId, playerName) {
      if (!sessionId) return;
      loadPhotos(sessionId, playerName);
    }

    function openLightbox(url) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox-dl').href = url;
      const lb = document.getElementById('lightbox');
      lb.classList.remove('hidden');
      lb.classList.add('flex');
    }

    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      lb.classList.add('hidden');
      lb.classList.remove('flex');
    }

    function updateBanner(s) {
      const banner = document.getElementById('live-banner');
      if (!s || !s.active) {
        banner.classList.add('hidden');
        banner.classList.remove('flex');
        return;
      }
      banner.classList.remove('hidden');
      banner.classList.add('flex');
      document.getElementById('live-player').innerText = s.player_name;
      document.getElementById('live-phase').innerText = s.phase;
      document.getElementById('live-touches').innerText = s.touch_count;
    }

    // Connect SSE for live updates without refreshing
    const evt = new EventSource('/public/events/stream');
    evt.addEventListener('session_update', e => updateBanner(JSON.parse(e.data)));
    evt.addEventListener('game_complete', () => { loadLeaderboard(); loadPhotos(); });
    evt.addEventListener('photo_uploaded', () => loadPhotos());
    evt.addEventListener('leaderboard_cleared', () => loadLeaderboard());

    // Initial load
    fetch('/public/session').then(r => r.json()).then(updateBanner);
    loadLeaderboard();
    loadPhotos();
  </script>
</body>
</html>
