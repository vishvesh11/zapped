name: Build and Push Buzzwire App Image

on:
  push:
    branches:
      - main
    paths:
      # No leading slash: GitHub path filters are relative to the repo root.
      - "backend/**"
      - "requirements.txt"
      - "dockerfile"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/buzzwire-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run test suite (backend, firmware simulation, UI end-to-end)
        run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # REQUIRED: Allows the action to push commits back to the repo
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to commit and push changes

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Buzzwire image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update values.yaml and push to GitHub
        run: |
          # 1. Update the tag in values.yaml using sed
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' helm/buzzwire-app/values.yaml

          # 2. Configure Git bot identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 3. Commit and push the change
          git add helm/buzzwire-app/values.yaml
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          # main may have moved while the image was building
          git pull --rebase origin main
          git push
